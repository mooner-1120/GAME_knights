<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IRON OATH</title>
<!-- 픽셀 폰트: Press Start 2P(영문 제목) · Galmuri11(한글/일본어 일부) · DotGothic16(일본어). 불러오지 못하면 시스템 글꼴로 대체됩니다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
  :root { --font: 'Galmuri11', 'DotGothic16', 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', sans-serif; --px: 'Press Start 2P', 'Galmuri11', monospace; --ac: #4db2ff; --gold: #ffd24a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: #fff; font-family: var(--font); user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  b { font-weight: 700; }
  button { font: inherit; cursor: pointer; }
  .btn { padding: 14px 28px; font: 14px var(--px); color: #111; background: var(--gold); border: 3px solid #000; box-shadow: 4px 4px 0 #000; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
  .btn:disabled { filter: grayscale(.8); cursor: wait; }
  .btn2 { padding: 10px 16px; font: 11px var(--px); color: #fff; background: #1b2330; border: 3px solid #000; box-shadow: 3px 3px 0 #000; line-height: 1.5; }
  .btn2:hover { background: #26324a; outline: 2px solid var(--ac); }
  .btn2.danger:hover { background: #4a1d17; outline-color: #e0604a; }
  select { padding: 7px 10px; font: 13px var(--font); color: #fff; background: #1b2330; border: 3px solid #000; }

  /* ───── 로비 (krunker 스타일: 상단 바 + 좌측 패널 + 우측 캐릭터) ───── */
  #lobby { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: linear-gradient(rgba(6,10,18,.62), rgba(6,10,18,.84)); backdrop-filter: blur(2px); }
  #lobby::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 2px, transparent 2px 4px); }
  #topbar { position: relative; display: flex; align-items: center; gap: 22px; padding: 10px 22px; background: rgba(0,0,0,.6); border-bottom: 4px solid #000; flex-wrap: wrap; }
  #logo { font: 20px var(--px); color: var(--gold); text-shadow: 3px 3px 0 #000; }
  #nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  #nav button { padding: 10px 14px; font: 11px var(--px); color: #8fa3c0; background: transparent; border: 0; border-bottom: 4px solid transparent; }
  #nav button:hover { color: #fff; }
  #nav button.on { color: #fff; border-bottom-color: var(--ac); }
  #topright { display: flex; align-items: center; gap: 12px; }
  #acct { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  #acct img { width: 32px; height: 32px; border: 2px solid #000; image-rendering: pixelated; }
  #acct small { display: block; color: #9fb0c8; font-size: 11px; }
  #lobmain { position: relative; flex: 1; display: flex; gap: 20px; padding: 20px 24px; min-height: 0; }
  #lcol { flex: 1; min-width: 0; overflow: auto; }
  .tab { display: none; }
  .tab.on { display: block; }
  .box { background: rgba(8,12,20,.82); border: 3px solid #000; box-shadow: 0 0 0 3px rgba(255,255,255,.1), 6px 6px 0 #000; padding: 20px; }
  #pvcol { width: min(380px, 38vw); flex: none; display: flex; flex-direction: column; overflow: auto; }
  #lobby.wide #pvcol { display: none; }
  #pv { width: 100%; height: 300px; display: block; background: radial-gradient(circle at 50% 75%, #2a3752, #0d121c); border: 3px solid #000; }
  #pv-name { margin: 12px 0 2px; font: 16px var(--px); color: var(--gold); }
  #pv-role { color: var(--ac); font-size: 13px; }
  #pv-desc { margin: 6px 0 10px; color: #c7d2e4; font-size: 13px; }
  #pv-skill { margin-top: 10px; font-size: 12px; line-height: 1.6; color: #dfe7f5; }
  #pv-skill b, .skl b { display: inline-block; min-width: 18px; padding: 0 4px; margin-right: 4px; text-align: center; color: #111; background: var(--gold); }
  #pv-skill em, .skl em { font-style: normal; color: #fff3b0; }
  #hero { font: 40px/1.2 var(--px); color: var(--gold); text-shadow: 5px 5px 0 #000; margin: 0 0 6px; }
  .sub { margin: 0 0 22px; color: #9fb0c8; font-size: 13px; letter-spacing: 2px; }
  .h2 { margin: 0 0 12px; font: 15px var(--px); color: var(--gold); }
  .inp { width: min(260px, 100%); padding: 10px 12px; font: 14px var(--font); color: #fff; background: #0d121c; border: 3px solid #000; outline: none; user-select: text; -webkit-user-select: text; }
  .inp:focus { border-color: var(--ac); }
  .rrow { display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 6px; background: rgba(12,18,30,.9); border: 3px solid #000; font-size: 13px; }
  .rrow .nm { flex: 1; min-width: 0; } .rrow small { display: block; color: #8fa3c0; }
  #name { width: min(360px, 100%); padding: 12px 14px; font: 16px var(--font); color: #fff; background: #0d121c; border: 3px solid #000; outline: none; user-select: text; -webkit-user-select: text; }
  #name:focus { border-color: var(--ac); }
  #lobmsg { min-height: 22px; margin: 14px 0 4px; color: #ff8a7a; font-size: 13px; }
  .note { color: #8fa3c0; font-size: 12px; margin: 10px 0 0; }
  #pbadge { font: 11px var(--px); color: #ffe9a8; white-space: nowrap; }
  .h3 { margin: 18px 0 8px; font: 12px var(--px); color: var(--ac); }
  .pf-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .pf-head b { font: 16px var(--px); color: var(--gold); }
  .xpbar { flex: 1; min-width: 120px; height: 12px; background: rgba(0,0,0,.6); border: 2px solid #000; } .xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(#6ad06a, #2f8a3a); }
  .pf-head small { color: #9fb0c8; }
  .pf-row { display: flex; align-items: center; gap: 12px; margin: 10px 0; font-size: 14px; color: #e9dcb8; } .pf-row span { min-width: 90px; color: #9fb0c8; } .pf-row b { color: #ffe9a8; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 12px; color: #f3e7c4; background: #131b28; border: 2px solid #3a4a64; cursor: pointer; }
  .chip i { width: 12px; height: 12px; border: 1px solid #000; display: inline-block; } .chip.on { background: #2b3a22; box-shadow: 0 0 0 2px #e6c473; }
  .ach { display: flex; align-items: center; gap: 10px; padding: 7px 10px; margin-bottom: 5px; background: rgba(12,18,30,.9); border: 2px solid #000; font-size: 13px; }
  .ach .nm { flex: 1; min-width: 0; } .ach small { display: block; color: #8fa3c0; } .ach.done { border-color: #6a8a3a; } .ach .pg { width: 90px; height: 8px; background: #000; } .ach .pg i { display: block; height: 100%; background: #e6c473; }
  .pull { display: inline-block; margin: 4px; padding: 8px 12px; font-size: 13px; background: #131b28; border: 3px solid #3a4a64; min-width: 150px; }
  .pull small { display: block; color: #9fb0c8; font-size: 11px; } .pull.new { box-shadow: 0 0 10px currentColor; }
  #x-reward { margin-top: 10px; color: #9be28a; font-size: 18px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .card { padding: 12px; text-align: left; background: rgba(12,18,30,.9); border: 3px solid #000; cursor: pointer; }
  .card:hover { outline: 2px solid #5a6c8a; }
  .card.sel { outline: 3px solid var(--ac); background: #16223a; }
  .card h3 { margin: 0 0 2px; font-size: 15px; color: #fff; }
  .card .d { margin: 0 0 8px; font-size: 11px; color: #9fb0c8; min-height: 28px; }
  .stat { display: flex; align-items: center; gap: 8px; font-size: 11px; margin: 4px 0; color: #c7d2e4; }
  .stat span { width: 54px; flex: none; }
  .bar { flex: 1; height: 8px; background: #05080d; border: 1px solid #000; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #2a7fcf, var(--ac)); }
  .skl { margin-top: 7px; padding-top: 6px; border-top: 1px solid #26324a; font-size: 11px; color: #c7d2e4; line-height: 1.5; }
  table.lb { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.lb th, table.lb td { padding: 8px 10px; text-align: left; border-bottom: 2px solid #1b2330; }
  table.lb th { color: var(--ac); font: 11px var(--px); }
  table.lb img { width: 22px; height: 22px; vertical-align: middle; margin-right: 8px; border: 2px solid #000; }
  #login-modal { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.7); }
  #login-modal .box { width: min(420px, 92vw); text-align: center; }
  #login-modal h2 { margin: 0 0 8px; font: 16px var(--px); color: var(--gold); }
  #login-providers { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
  #login-providers .btn2 { font: 13px var(--font); padding: 12px; }
  .ctl { color: #8fa3c0; font-size: 12px; }

  /* ───── HUD ───── */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: .85; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; box-shadow: 0 0 3px #000; }
  #crosshair::before { left: 10px; top: 4px; width: 2px; height: 14px; }
  #crosshair::after { top: 10px; left: 4px; height: 2px; width: 14px; }
  #hitmark { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; opacity: 0; transition: opacity .15s;
    border: 3px solid #ff5a4a; transform: rotate(45deg); }
  #hitmark.blocked { border-color: #cfd8e8; }
  #hitmark.kill { border-color: #ff2a1a; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-width: 5px; box-shadow: 0 0 12px #ff2a1a; }
  #dmg { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(190,20,10,.85)); transition: opacity .35s; }
  #lowhp { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(150,0,0,.55)); }
  #lowhp.on { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .15; } 50% { opacity: .9; } }

  #minimap { position: absolute; left: 18px; top: 18px; width: 168px; height: 168px; border-radius: 50%; border: 3px solid #6d5a33;
    background: rgba(10,8,5,.55); box-shadow: 0 0 10px rgba(0,0,0,.6); }
  #netinfo { position: absolute; left: 22px; top: 192px; font-size: 13px; color: #d9cfae; text-shadow: 0 1px 3px #000; font-family: monospace; }
  #feed { position: absolute; right: 20px; top: 20px; text-align: right; font-size: 16px; text-shadow: 0 2px 4px #000; }
  #feed div { background: rgba(0,0,0,.45); padding: 3px 10px; margin-bottom: 4px; border-radius: 3px; }
  #banner { position: absolute; left: 0; right: 0; top: 17%; text-align: center; font-size: 40px; font-weight: 700; color: #ffd45a;
    text-shadow: 0 3px 0 #6b3a00, 0 0 18px rgba(255,180,60,.6); opacity: 0; letter-spacing: 3px; }
  #banner.show { animation: banner 1.6s ease-out; }
  @keyframes banner { 0% { opacity: 0; transform: scale(1.7); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.96); } }
  #toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); padding: 8px 18px; font-size: 16px; background: rgba(0,0,0,.7);
    border: 1px solid #6d5a33; border-radius: 4px; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #toast.on { opacity: 1; }

  #hpwrap { position: absolute; left: 24px; bottom: 24px; width: 300px; }
  #clsname { font-size: 18px; margin-bottom: 6px; text-shadow: 0 2px 4px #000; color: #e6c473; }
  #status { position: absolute; left: 24px; bottom: 112px; display: flex; gap: 8px; }
  #status div { padding: 3px 9px; font-size: 14px; background: rgba(0,0,0,.6); border: 1px solid #6d5a33; border-radius: 4px; }
  #hpbar { height: 20px; background: rgba(0,0,0,.6); border: 2px solid #6d5a33; border-radius: 3px; overflow: hidden; }
  #hpfill { height: 100%; width: 100%; background: linear-gradient(#d9473a, #8e1d14); transition: width .15s; }
  #hptext { margin: 3px 0 5px; font-size: 14px; text-shadow: 0 2px 4px #000; }

  #skills { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 12px; }
  .slot { position: relative; width: 74px; height: 74px; background: rgba(20,15,9,.8); border: 3px solid #6d5a33; border-radius: 8px; overflow: hidden; text-align: center; }
  .slot.ready { border-color: #e6c473; box-shadow: 0 0 12px rgba(230,196,115,.45); }
  .slot .ic { font-size: 34px; line-height: 56px; }
  .slot .nm { position: absolute; left: 0; right: 0; bottom: 3px; font-size: 11px; color: #e9dcb8; text-shadow: 0 1px 2px #000; }
  .slot .key { position: absolute; left: 4px; top: 3px; min-width: 18px; padding: 0 4px; font-size: 12px; font-weight: 700; color: #1a1308; background: #e6c473; border-radius: 3px; }
  .slot .cdfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.72); }
  .slot .cdtxt { position: absolute; left: 0; right: 0; top: 18px; font-size: 24px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px #000; }

  #kd { position: absolute; right: 24px; bottom: 24px; font-size: 18px; text-shadow: 0 2px 4px #000; text-align: right; }
  #floaters { position: absolute; inset: 0; overflow: hidden; }
  .dn { position: absolute; font-size: 26px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: floatup .9s ease-out forwards; transform: translate(-50%, -50%); }
  .dn.blocked { color: #aab7cf; font-size: 20px; }
  .dn.skill { color: #ffd45a; font-size: 32px; }
  .dn.big { font-size: 34px; color: #ffb35a; }
  .dn.kill { font-size: 40px; color: #ff4a3a; }
  @keyframes floatup { 0% { opacity: 0; margin-top: 10px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -60px; } }
  #death { position: absolute; left: 0; right: 0; top: 32%; text-align: center; font-size: 44px; color: #e05a4a; text-shadow: 0 3px 10px #000; display: none; }
  #death small { display: block; font-size: 20px; color: #ddd; margin-top: 8px; }
  #death small.di { font-size: 16px; color: #e9dcb8; margin-top: 4px; }
  #death small.sp { font-size: 15px; color: #9fd0ff; margin-top: 10px; }
  #stunned { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font-size: 30px; color: #ffe27a; text-shadow: 0 2px 8px #000; display: none; }
  #board { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); min-width: 460px; background: rgba(10,8,5,.82);
    border: 2px solid #6d5a33; border-radius: 6px; padding: 14px 18px; display: none; }
  #board table { width: 100%; border-collapse: collapse; }
  #board th, #board td { padding: 5px 8px; text-align: left; font-size: 16px; }
  #board th { color: #e6c473; border-bottom: 1px solid #5a4a2a; }
  #board td.n, #board th.n { text-align: right; }
  #board tr.me td { color: #ffe9a8; font-weight: bold; }

  /* ───── ESC 메뉴 ───── */
  #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 12; background: rgba(0,0,0,.62); overflow: auto; }
  .mpanel { width: min(760px, 95vw); max-height: 94vh; overflow: auto; padding: 26px 30px; background: linear-gradient(#241b11, #17110a);
    border: 2px solid #6d5a33; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.7); }
  .mpanel.wide { width: min(1080px, 96vw); }
  #menu-cards { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin: 8px 0; }
  #menu .card { padding: 11px 12px; }
  .mpanel h2 { margin: 0 0 4px; font-size: 30px; color: #e6c473; letter-spacing: 6px; text-align: center; }
  .mpanel .hint { text-align: center; color: #a5946b; font-size: 14px; margin: 0 0 18px; }
  .mview { display: none; }
  .mview.on { display: block; }
  .mbtns { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
  .mbtns .btn, .mbtns .btn2 { width: 100%; }
  .setrow { display: grid; grid-template-columns: 150px 1fr 56px; gap: 12px; align-items: center; margin: 12px 0; font-size: 16px; color: #e9dcb8; }
  .setrow.chk { grid-template-columns: 1fr auto; }
  .setrow output { text-align: right; color: #ffe9a8; font-variant-numeric: tabular-nums; }
  .setrow input[type=range] { width: 100%; accent-color: #e6c473; }
  .setrow input[type=checkbox] { width: 22px; height: 22px; accent-color: #e6c473; }
  .setrow select { padding: 7px 10px; font: inherit; color: #f1e6c8; background: #1d1710; border: 1px solid #6d5a33; border-radius: 4px; }
  .back { margin-top: 18px; text-align: center; }
  table.keys { width: 100%; border-collapse: collapse; font-size: 16px; }
  table.keys td { padding: 7px 8px; border-bottom: 1px solid #3a2e1c; }
  table.keys td:first-child { width: 42%; color: #ffe9a8; }
  kbd { display: inline-block; min-width: 26px; padding: 1px 7px; margin: 0 2px; text-align: center; font: 14px monospace; color: #1a1308; background: #e6c473; border-radius: 4px; box-shadow: 0 2px 0 #6b4d12; }
  #menu-note { min-height: 20px; margin: 4px 0 0; text-align: center; color: #e6c473; font-size: 14px; }

  /* ───── 픽셀 스타일 덧입히기 ───── */
  #banner, #death { font-family: var(--px); }
  #banner { font-size: 28px; line-height: 1.4; }
  #death { font-size: 30px; line-height: 1.5; }
  .dn { font-family: var(--px); font-size: 20px; }
  .dn.skill { font-size: 22px; }
  #clsname { font-family: var(--px); font-size: 13px; }
  .mpanel { background: #121a28; border: 3px solid #000; border-radius: 0; box-shadow: 0 0 0 3px rgba(255,255,255,.12), 8px 8px 0 #000; }
  .mpanel h2 { font: 20px var(--px); letter-spacing: 1px; color: var(--gold); text-shadow: 3px 3px 0 #000; }
  .mpanel .hint, .setrow, table.keys { font-family: var(--font); }
  .card, .slot, #hpbar, #board, #minimap, #toast, #feed div, #status div { border-radius: 0 !important; }
  /* ───── 모바일 ───── */
  html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #c, #hud { touch-action: none; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; text-align: center; padding: 30px; background: #0b0e14; color: #fff; font: 16px/1.6 var(--font); }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  @media (pointer: coarse), (max-height: 520px) {
    #lobby { overflow: auto; touch-action: pan-y; }
    #topbar { padding: 6px 12px; gap: 10px; } #logo { font-size: 14px; }
    #nav button { padding: 8px 10px; font-size: 9px; }
    #lobmain { padding: 10px 12px; gap: 12px; } #hero { font-size: 24px; } .box { padding: 12px; }
    #pvcol { width: 34vw; } #pv { height: min(200px, 34vh); }
    .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .btn { padding: 10px 18px; font-size: 12px; }
    #menu .mpanel { max-height: 94vh; overflow: auto; padding: 12px; }
  }
</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="lowhp"></div>
  <div id="dmg"></div>
  <div id="crosshair"></div>
  <div id="hitmark"></div>
  <canvas id="minimap" width="168" height="168"></canvas>
  <div id="netinfo"></div>
  <div id="feed"></div>
  <div id="banner"></div>
  <div id="floaters"></div>
  <div id="status"></div>
  <div id="hpwrap">
    <div id="clsname"></div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="hptext"></div>
  </div>
  <div id="skills">
    <div class="slot" id="slot-q"><div class="key">Q</div><div class="ic"></div><div class="nm"></div><div class="cdfill"></div><div class="cdtxt"></div></div>
    <div class="slot" id="slot-e"><div class="key">E</div><div class="ic"></div><div class="nm"></div><div class="cdfill"></div><div class="cdtxt"></div></div>
  </div>
  <div id="kd"></div>
  <div id="death"></div>
  <div id="stunned" data-i18n="stunned"></div>
  <div id="toast"></div>
  <div id="board"><table><thead><tr><th data-i18n="b_name"></th><th data-i18n="b_class"></th><th class="n" data-i18n="b_kills"></th><th class="n" data-i18n="b_deaths"></th></tr></thead><tbody id="boardbody"></tbody></table></div>
</div>


<!-- ESC 메뉴: 포인터 잠금이 풀리면(=ESC) 자동으로 뜹니다 -->
<div id="menu">
  <div class="mpanel">
    <div class="mview on" id="mv-main">
      <h2 data-i18n="paused"></h2>
      <p class="hint" data-i18n="pausedHint"></p>
      <div class="mbtns">
        <button class="btn" id="m-resume" data-i18n="resume"></button>
        <button class="btn2" data-view="chars" data-i18n="chooseClass"></button>
        <button class="btn2" id="m-mode" style="display:none"></button>
        <button class="btn2" id="m-map" style="display:none"></button>
        <button class="btn2" id="m-botadd" style="display:none"></button>
        <button class="btn2" id="m-botsub" style="display:none"></button>
        <button class="btn2" id="m-diff" style="display:none"></button>
        <button class="btn2" id="m-invite" style="display:none"></button>
        <button class="btn2" data-view="settings" data-i18n="settings"></button>
        <button class="btn2" data-view="help" data-i18n="controls"></button>
        <button class="btn2 danger" id="m-home" data-i18n="home"></button>
      </div>
    </div>

    <div class="mview" id="mv-chars">
      <h2 data-i18n="chooseClass"></h2>
      <p class="hint" data-i18n="charHint"></p>
      <div class="cards" id="menu-cards"></div>
      <p id="menu-note"></p>
      <div class="back"><button class="btn2" data-view="main" data-i18n="back"></button></div>
    </div>

    <div class="mview" id="mv-settings">
      <h2 data-i18n="settings"></h2>
      <p class="hint" data-i18n="saved"></p>
      <label class="setrow"><span data-i18n="language"></span><select id="set-lang"></select><span></span></label>
      <label class="setrow"><span data-i18n="sens"></span><input type="range" id="set-sens" min="0.3" max="3" step="0.05"><output id="o-sens"></output></label>
      <label class="setrow"><span data-i18n="fov"></span><input type="range" id="set-fov" min="60" max="110" step="1"><output id="o-fov"></output></label>
      <label class="setrow"><span data-i18n="vol"></span><input type="range" id="set-vol" min="0" max="1" step="0.05"><output id="o-vol"></output></label>
      <label class="setrow"><span data-i18n="quality"></span>
        <select id="set-quality"><option value="low" data-i18n="q_low"></option><option value="mid" data-i18n="q_mid"></option><option value="high" data-i18n="q_high"></option></select><span></span></label>
      <label class="setrow chk"><span data-i18n="minimap"></span><input type="checkbox" id="set-minimap"></label>
      <label class="setrow chk"><span data-i18n="netinfo"></span><input type="checkbox" id="set-netinfo"></label>
      <label class="setrow chk"><span data-i18n="bob"></span><input type="checkbox" id="set-bob"></label>
      <div class="setrow chk"><span data-i18n="keybinds"></span><button class="btn2" data-view="keys" data-i18n="keybinds"></button></div>
      <div class="back"><button class="btn2" id="set-back" data-i18n="back"></button></div>
    </div>

    <div class="mview" id="mv-keys">
      <h2 data-i18n="keybinds"></h2>
      <p class="hint" data-i18n="key_hint"></p>
      <div id="keylist"></div>
      <p class="hint" id="keymsg">&nbsp;</p>
      <div class="back"><button class="btn2" id="key-reset" data-i18n="key_reset"></button> <button class="btn2" data-view="settings" data-i18n="back"></button></div>
    </div>

    <div class="mview" id="mv-help">
      <h2 data-i18n="controls"></h2>
      <p class="hint">&nbsp;</p>
      <table class="keys">
        <tr><td><kbd data-act="forward">W</kbd><kbd data-act="left">A</kbd><kbd data-act="back">S</kbd><kbd data-act="right">D</kbd></td><td data-i18n="k_move"></td></tr>
        <tr><td><kbd data-act="sprint">Shift</kbd></td><td data-i18n="k_sprint"></td></tr>
        <tr><td><kbd data-act="jump">Space</kbd></td><td data-i18n="k_jump"></td></tr>
        <tr><td><kbd data-act="crouch">C</kbd></td><td data-i18n="k_crouch"></td></tr>
        <tr><td><kbd>LMB</kbd></td><td data-i18n="k_attack"></td></tr>
        <tr><td><kbd>RMB</kbd> / <kbd data-act="block">F</kbd></td><td data-i18n="k_block"></td></tr>
        <tr><td><kbd data-act="skill">Q</kbd></td><td data-i18n="k_skill"></td></tr>
        <tr><td><kbd data-act="kick">E</kbd></td><td data-i18n="k_kick"></td></tr>
        <tr><td><kbd data-act="chat">Y</kbd> / <kbd>Enter</kbd> / <kbd data-act="teamchat">T</kbd></td><td data-i18n="k_chat"></td></tr>
        <tr><td><kbd data-act="emote">V</kbd></td><td data-i18n="k_emote"></td></tr>
        <tr><td><kbd data-act="board">Tab</kbd></td><td data-i18n="k_score"></td></tr>
        <tr><td><kbd>Esc</kbd></td><td data-i18n="k_menu"></td></tr>
      </table>
      <div class="skl" id="help-skills"></div>
      <div class="back"><button class="btn2" data-view="main" data-i18n="back"></button></div>
    </div>
  </div>
</div>

<div id="lobby">
  <div id="topbar">
    <div id="logo">IRON OATH</div>
    <div id="nav">
      <button class="on" data-tab="play" data-i18n="nav_play"></button>
      <button data-tab="class" data-i18n="nav_class"></button>
      <button data-tab="rooms" data-i18n="nav_rooms"></button>
      <button data-tab="profile" data-i18n="nav_profile"></button>
      <button data-tab="shop" data-i18n="nav_shop"></button>
      <button data-tab="ranks" data-i18n="nav_ranks"></button>
      <button data-tab="settings" data-i18n="nav_settings"></button>
    </div>
    <div id="topright">
      <div id="pbadge"></div>
      <select id="lang" aria-label="Language"></select>
      <div id="acct"></div>
    </div>
  </div>

  <div id="lobmain">
    <div id="lcol">
      <section class="tab on box" id="tab-play">
        <h1 id="hero">IRON OATH</h1>
        <p class="sub" data-i18n="subtitle"></p>
        <input id="name" maxlength="16" data-i18n-ph="name" autocomplete="off">
        <div class="row" style="margin-top:18px">
          <button class="btn" id="join" data-i18n="play"></button>
        </div>
        <div class="row" style="margin-top:12px">
          <select id="pr-bots"></select><select id="pr-diff"></select><select id="pr-mode"></select><select id="pr-map"></select>
          <button class="btn2" id="practice" data-i18n="practice"></button>
        </div>
        <p class="note" data-i18n="practice_note"></p>
        <p id="lobmsg"></p>
        <p class="note" data-i18n="mode_note"></p>
        <p class="note" data-i18n="tip"></p>
      </section>
      <section class="tab" id="tab-class">
        <div class="cards" id="cards"></div>
      </section>
      <section class="tab box" id="tab-rooms">
        <h2 class="h2" data-i18n="rooms_title"></h2>
        <div id="roomlist"></div>
        <p class="note" id="roomempty"></p>
        <button class="btn2" id="room-refresh" data-i18n="room_refresh"></button>
        <h2 class="h2" style="margin-top:22px" data-i18n="room_create"></h2>
        <div class="row">
          <input class="inp" id="rc-name" maxlength="24" data-i18n-ph="room_name">
          <input class="inp" id="rc-pass" maxlength="16" data-i18n-ph="room_pass">
        </div>
        <div class="row" style="margin-top:10px">
          <select id="rc-mode"></select><select id="rc-map"></select><select id="rc-max"></select><select id="rc-bots"></select><select id="rc-diff"></select>
          <button class="btn" id="rc-go" data-i18n="room_create"></button>
        </div>
        <p class="note" data-i18n="room_hostnote"></p>
      </section>
      <section class="tab box" id="tab-profile">
        <h2 class="h2" data-i18n="nav_profile"></h2>
        <p class="note" id="pf-guest"></p>
        <div id="pf-main" style="display:none">
          <div class="pf-head"><b id="pf-lv"></b><div class="xpbar"><i id="pf-xpfill"></i></div><small id="pf-xp"></small></div>
          <div class="pf-row"><span data-i18n="pf_coins"></span><b id="pf-coins"></b></div>
          <div class="pf-row"><span data-i18n="pf_title"></span><select id="pf-titlesel"></select></div>
          <h3 class="h3" data-i18n="pf_inv"></h3>
          <div id="pf-inv"></div>
          <h3 class="h3" data-i18n="pf_ach"></h3>
          <div id="pf-ach"></div>
          <h3 class="h3" data-i18n="pf_class"></h3>
          <table class="lb" id="pf-cs"></table>
        </div>
      </section>
      <section class="tab box" id="tab-shop">
        <h2 class="h2" data-i18n="shop_title"></h2>
        <p class="note" data-i18n="shop_note"></p>
        <div class="pf-row"><span data-i18n="pf_coins"></span><b id="sh-coins">-</b></div>
        <div id="sh-odds" class="note"></div>
        <div class="row" style="margin:14px 0">
          <button class="btn" id="sh-pull1"></button><button class="btn2" id="sh-pull10"></button>
        </div>
        <p class="note" id="sh-pity"></p>
        <p class="note" id="sh-err" style="color:#ff9a8a"></p>
        <div id="sh-result"></div>
      </section>
      <section class="tab box" id="tab-ranks">
        <h2 style="margin:0 0 12px;font:15px var(--px);color:var(--gold)" data-i18n="leaderboard"></h2>
        <div class="row" style="margin-bottom:10px"><select id="lb-class"></select></div>
        <table class="lb"><thead><tr><th>#</th><th data-i18n="b_name"></th><th data-i18n="b_kills"></th><th data-i18n="b_deaths"></th><th>W</th></tr></thead><tbody id="lbbody"></tbody></table>
        <p class="note" id="lbempty"></p>
      </section>
      <button id="lobby-settings" style="display:none"></button>
    </div>
    <aside id="pvcol" class="box">
      <canvas id="pv"></canvas>
      <div id="pv-name"></div>
      <div id="pv-role"></div>
      <div id="pv-desc"></div>
      <div id="pv-stats"></div>
      <div id="pv-skill"></div>
    </aside>
  </div>
</div>

<div id="login-modal">
  <div class="box">
    <h2 data-i18n="signin"></h2>
    <p class="note" data-i18n="login_why"></p>
    <div id="login-providers"></div>
    <button class="btn2" id="login-close" data-i18n="back"></button>
  </div>
</div>

<div id="rotate" data-i18n="rotate"></div>
<script type="module" src="/auth.js"></script>
<script type="module" src="/game.js"></script>
</body>
</html>
